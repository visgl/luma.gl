</head><body>
  <div id="scene" aria-label="Interactive globe with cloud cover"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Globe weather</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Device<select id="backend" aria-label="Device"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle">Sun<input id="sun" type="checkbox" checked /></label>
      <label class="toggle">Moon<input id="moon" type="checkbox" checked /></label>
      <label class="toggle">Stars<input id="stars" type="checkbox" checked /></label>
      <div class="sky-actions"><button id="center" type="button">Center</button><button id="look-sun" type="button">Sun</button><button id="look-moon" type="button">Moon</button></div>
      <label class="toggle">Clouds<input id="clouds" type="checkbox" checked /></label>
      <label class="toggle">Animate<input id="animate" type="checkbox" checked /></label>
    </section>
    <section class="control-card"><h2>Cloud cover</h2>
      <label>Coverage<input id="cover" type="range" min="0" max="1" step="0.01" value="0.45" /></label>
      <label>Cloud size<input id="scale" type="range" min="300" max="1800" step="25" value="900" /></label>
      <label>Drift speed<input id="drift" type="range" min="0" max="3" step="0.05" value="1" /></label>
      <label>UTC hour<input id="sunlight" type="range" min="0" max="24" step="0.1" value="13" /></label>
    </section>
    <output id="status" class="selection" aria-live="polite">Preparing the globe…</output>
    <p class="hint">Procedural clouds with accelerated drift.<br />Drag to orbit · Scroll to zoom<br />Sun and moon follow 4 October 2026 UTC</p>
  </aside>
</body></html>
