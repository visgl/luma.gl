name: Physics endurance

on:
  schedule:
    # 07:17 UTC: 03:17 Eastern daylight time / 02:17 Eastern standard time.
    - cron: '17 7 * * *'
  workflow_dispatch:
  # Validate the full matrix when its definition or scheduling changes.
  pull_request:
    paths:
      - '.github/workflows/physics-endurance.yml'
      - 'test/utils/browser-test-groups.ts'
      - 'vitest.config.ts'
      - 'modules/graph/test/gpu-physics/rigid-body-stack-*.ts'
      - 'modules/graph/test/gpu-physics/rigid-body-difficult-stacks.spec.ts'
      - 'modules/graph/test/gpu-physics/rigid-body-mass-ratio-stacks.spec.ts'
      - 'modules/graph/test/gpu-physics/rigid-body-offset-stacks.spec.ts'

permissions:
  contents: read

concurrency:
  group: physics-endurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  endurance:
    name: Full physics endurance matrix
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack / Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Cache Yarn artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn4-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-yarn4-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('yarn.lock', 'package.json') }}
      - name: Install Playwright Chromium
        run: yarn exec playwright install chromium
      - name: Require WebGPU and WebGL presentation
        timeout-minutes: 2
        run: yarn test-presentation
      - name: Run full endurance matrix
        shell: bash
        run: |
          yarn test-physics-endurance --reporter=default --reporter=junit --outputFile.junit=test-results/physics-endurance.xml 2>&1 | tee physics-endurance.log
      - name: Verify the entire matrix executed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report = readFileSync('test-results/physics-endurance.xml', 'utf8');
          assert.match(report, /<testsuites\b[^>]*\btests="12"/);
          assert.doesNotMatch(report, /<skipped(?:\s|\/|>)/);
          NODE
      - name: Upload endurance results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: physics-endurance-results
          path: |
            test-results/physics-endurance.xml
            physics-endurance.log
          retention-days: 14
          if-no-files-found: warn
