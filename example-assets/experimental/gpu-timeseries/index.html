<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Room — GPU time series</title>
    <link rel="icon" href="data:," />
    <style>html,body{margin:0;width:100%;height:100%;background:#060b13}#container{position:relative;width:100%;height:100%}canvas{width:100%;height:100%;display:block;touch-action:none}</style>
  </head>
  <body>
    <div id="container"><canvas id="canvas"></canvas><div id="info-box" style="position:absolute;top:12px;left:20px;z-index:10;max-width:calc(100% - 40px)"></div></div>
    <script type="module">
      import React from 'react';
      import {createRoot} from 'react-dom/client';
      import {flushSync} from 'react-dom';
      import {InfoBoxView} from '../../example-info-box';
      import {luma} from '@luma.gl/core';
      import {makeAnimationLoop} from '@luma.gl/engine';
      import {webgpuAdapter} from '@luma.gl/core/webgpu';
      import Template from './app.ts';
      const infoBox = createRoot(document.getElementById('info-box'));
      flushSync(() => infoBox.render(React.createElement(InfoBoxView, {
        title: 'Signal Room',
        subtitle: 'Three million samples · WebGPU time series',
        html: Template.info,
        websiteBaseUrl: '/'
      })));
      const device = luma.createDevice({adapters: [webgpuAdapter], type: 'webgpu', optionalFeatures: ['timestamp-query'], createCanvasContext: {canvas: 'canvas'}});
      const loop = makeAnimationLoop(Template, {device});
      loop.start().catch(error => {document.getElementById('container').textContent = error.message;});
    </script>
  </body>
</html>
