<!doctype html>
<head>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030712; color-scheme: dark; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
  </style>
</head>
<script type="module">
  import {luma} from '@luma.gl/core';
  import {makeAnimationLoop} from '@luma.gl/engine';
  import {webgpuAdapter} from '@luma.gl/webgpu';
  import AnimationLoopTemplate from './app.ts';

  const device = luma.createDevice({
    id: 'advanced-effects',
    adapters: [webgpuAdapter],
    createCanvasContext: true,
    featureLevel: 'max'
  });
  makeAnimationLoop(AnimationLoopTemplate, {device}).start();
</script>
<body></body>
