<!doctype html>
<head>
  <link rel="icon" href="data:," />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030712; color-scheme: dark; }
    #controls { position: fixed; z-index: 1; top: 12px; left: 12px; width: 280px; max-height: calc(100vh - 48px); overflow: auto; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: rgb(8 15 27 / 92%); font: 12px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
  </style>
</head>
<script type="module">
  import {luma} from '@luma.gl/core';
  import {makeAnimationLoop} from '@luma.gl/engine';
  import {webgpuAdapter} from '@luma.gl/webgpu';
  import AnimationLoopTemplate from './app.ts';

  document.querySelector('#controls').innerHTML = AnimationLoopTemplate.info;
  const device = luma.createDevice({
    id: 'advanced-effects',
    adapters: [webgpuAdapter],
    createCanvasContext: true,
    featureLevel: 'max'
  });
  window.visualizationCity = makeAnimationLoop(AnimationLoopTemplate, {device});
  window.visualizationCity.start();
</script>
<body><aside id="controls" data-info-box-appearance="cinematic"></aside></body>
