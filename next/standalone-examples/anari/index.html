<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070913" />
    <title>ANARI · The Rendering Observatory</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        margin: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(ellipse at 50% 25%, rgba(46, 55, 102, 0.38), transparent 58%),
          #070913;
        color: #f2f4ff;
      }

      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        cursor: grab;
      }

      canvas:active {
        cursor: grabbing;
      }

      .veil {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(6, 8, 18, 0.9), transparent 29%, transparent 75%, rgba(6, 8, 18, 0.58)),
          linear-gradient(0deg, rgba(5, 7, 16, 0.82), transparent 22%, transparent 79%, rgba(5, 7, 16, 0.66));
      }

      .header,
      .story,
      .controls,
      .telemetry,
      .hint {
        position: fixed;
        z-index: 2;
      }

      .header {
        top: 36px;
        left: 48px;
      }

      .eyebrow,
      .meta-label {
        color: rgba(196, 205, 255, 0.56);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        font-size: 20px;
        font-weight: 540;
        letter-spacing: 0.11em;
      }

      .wordmark::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #a991ff;
        box-shadow: 0 0 18px #a991ff;
        content: "";
      }

      .story {
        top: 27%;
        left: 48px;
        width: min(355px, 35vw);
      }

      .scene-number {
        color: rgba(184, 163, 255, 0.83);
        font-size: 12px;
        letter-spacing: 0.22em;
      }

      .scene-title {
        max-width: 380px;
        margin: 19px 0 14px;
        font-size: clamp(44px, 5.5vw, 78px);
        font-weight: 440;
        letter-spacing: -0.085em;
        line-height: 0.97;
      }

      .scene-description {
        max-width: 298px;
        color: rgba(224, 230, 255, 0.64);
        font-size: 13px;
        line-height: 1.8;
      }

      .scene-list {
        display: grid;
        gap: 9px;
        margin-top: 35px;
      }

      .usd-import-panel {
        display: grid;
        gap: 8px;
        max-width: 275px;
        margin-top: 27px;
      }

      .usd-import-label,
      .usd-import-status {
        color: rgba(198, 207, 248, 0.52);
        font-size: 9px;
        letter-spacing: 0.11em;
      }

      .usd-scene-selector {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid rgba(170, 147, 246, 0.3);
        border-radius: 5px;
        background: rgba(18, 20, 40, 0.87);
        color: #e8e0ff;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }

      .usd-scene-selector option {
        background: #111322;
      }

      .usd-import-status {
        max-width: 275px;
        overflow-wrap: anywhere;
      }

      .scene-button,
      .mode-button {
        border: 0;
        background: transparent;
        color: rgba(210, 219, 255, 0.49);
        cursor: pointer;
        font: inherit;
        transition: color 180ms ease;
      }

      .scene-button {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 8px 0;
        font-size: 12px;
        text-align: left;
      }

      .scene-button::before {
        width: 19px;
        height: 1px;
        background: rgba(210, 219, 255, 0.33);
        content: "";
        transition: width 180ms ease, background 180ms ease;
      }

      .scene-button.active,
      .mode-button.active,
      .scene-button:hover,
      .mode-button:hover {
        color: #f0edff;
      }

      .scene-button.active::before {
        width: 31px;
        background: #ae95ff;
      }

      .controls {
        top: 39px;
        right: 48px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .mode-button {
        padding: 8px 1px;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .playground-link {
        border: 1px solid rgba(174, 149, 255, 0.32);
        border-radius: 4px;
        padding: 7px 9px;
        color: rgba(229, 220, 255, 0.88);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-decoration: none;
      }

      .playground-link:hover {
        border-color: rgba(194, 175, 255, 0.66);
        color: #fff;
      }

      .separator {
        width: 1px;
        height: 15px;
        background: rgba(207, 218, 255, 0.2);
      }

      .telemetry {
        right: 48px;
        bottom: 43px;
        display: flex;
        gap: 32px;
        text-align: right;
      }

      .meta-value {
        margin-top: 8px;
        color: rgba(238, 242, 255, 0.87);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      #ray-tracing-resolution-telemetry {
        flex: 0 0 22ch;
      }

      #ray-tracing-frame-telemetry {
        flex: 0 0 28ch;
      }

      .hint {
        bottom: 46px;
        left: 48px;
        color: rgba(202, 212, 255, 0.47);
        font-size: 10px;
        letter-spacing: 0.1em;
      }

      @media (max-width: 700px) {
        .header,
        .story,
        .hint {
          left: 23px;
        }

        .header {
          top: 23px;
        }

        .story {
          top: auto;
          bottom: 105px;
          width: calc(100vw - 48px);
        }

        .scene-title {
          font-size: 53px;
        }

        .controls {
          top: 24px;
          right: 22px;
          gap: 12px;
        }

        .telemetry {
          right: 22px;
          bottom: 25px;
          gap: 16px;
        }

        .hint,
        .scene-description {
          display: none;
        }

        .scene-list {
          display: flex;
          gap: 17px;
          margin-top: 17px;
        }

        .usd-import-panel {
          max-width: 230px;
          margin-top: 15px;
        }

        .usd-import-label,
        .usd-import-status {
          display: none;
        }

        .scene-button {
          font-size: 10px;
        }

        .scene-button::before {
          display: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/showcase-BYBq37zo.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/chunk-BRNzzbbm.js">
    <link rel="modulepreload" crossorigin href="./assets/buffer-layout-utils-BIP28hBl.js">
    <link rel="modulepreload" crossorigin href="./assets/debug-hooks-BaBoIcbs.js">
    <link rel="modulepreload" crossorigin href="./assets/wgsl-interface-scan-CLW9X4pL.js">
    <link rel="modulepreload" crossorigin href="./assets/usd-samples-Bba3kgdh.js">
  </head>
  <body>
    <div class="veil" aria-hidden="true"></div>
    <header class="header">
      <div class="eyebrow">Luma.gl · Anari proof of concept</div>
      <div class="wordmark">THE OBSERVATORY</div>
    </header>
    <main class="story">
      <div id="scene-number" class="scene-number">01 / 03</div>
      <h1 id="scene-title" class="scene-title"></h1>
      <p id="scene-description" class="scene-description"></p>
      <nav id="scene-list" class="scene-list" aria-label="Scenes"></nav>
      <section class="usd-import-panel" aria-label="Scene import">
        <span class="usd-import-label">IMPORT 3D SCENE</span>
        <select id="usd-scene-selector" class="usd-scene-selector" aria-label="Choose 3D scene">
          <option value="">Choose a 3D scene…</option>
          <option value="local-file">Open local USD/glTF file…</option>
        </select>
        <input id="usd-file-input" type="file" accept=".usd,.usda,.usdz,.gltf,.glb" hidden />
        <span id="usd-import-status" class="usd-import-status">USD · USDA · USDZ · glTF · GLB</span>
      </section>
    </main>
    <aside class="controls" aria-label="Renderer controls">
      <button class="mode-button active" data-renderer="default">LIT</button>
      <button class="mode-button" data-renderer="deferred">DEFERRED</button>
      <button class="mode-button" data-renderer="raytrace">RAYTRACE</button>
      <button class="mode-button" data-renderer="debugNormals">NORMALS</button>
      <button class="mode-button" data-renderer="debugDepth">DEPTH</button>
      <span class="separator" aria-hidden="true"></span>
      <button id="bloom-toggle" class="mode-button active">BLOOM</button>
      <span id="temporal-aa-separator" class="separator" aria-hidden="true"></span>
      <button
        id="temporal-aa-toggle"
        class="mode-button active"
        aria-pressed="true"
        title="Stabilize edges and reuse valid samples across frames"
      >
        TEMPORAL AA
      </button>
      <span class="separator" aria-hidden="true"></span>
      <a class="playground-link" href="./playground.html">JSON LAB ↗</a>
    </aside>
    <aside class="telemetry">
      <div>
        <div class="meta-label">Instances</div>
        <div id="instance-count" class="meta-value">—</div>
      </div>
      <div>
        <div class="meta-label">Draw calls</div>
        <div id="draw-count" class="meta-value">—</div>
      </div>
      <div id="ray-tracing-resolution-telemetry" hidden>
        <div class="meta-label">Ray resolution</div>
        <div id="ray-tracing-resolution" class="meta-value">—</div>
      </div>
      <div id="ray-tracing-frame-telemetry" hidden>
        <div class="meta-label">Ray frame</div>
        <div id="ray-tracing-frame" class="meta-value">—</div>
      </div>
      <div>
        <div class="meta-label">Backend</div>
        <div id="device-type" class="meta-value">—</div>
      </div>
    </aside>
    <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM · 1 / 2 / 3 TO SWITCH SCENES</div>
  </body>
</html>
