<main>

  <div class="play-area"><div class="cue-preview"><canvas id="cue-preview" aria-label="Rotating preview of the selected cue"></canvas></div><div class="stage"><canvas id="pool" tabindex="0" aria-label="Pool table. Drag to aim. Left and right arrows adjust aim. Use Shoot or Space to take a shot."></canvas><svg id="overlay" aria-hidden="true"><polyline id="cue-trail" fill="none" stroke="#f0ca78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/><polyline id="cue-trail-recent" fill="none" stroke="#fff2c5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/><g id="aim-guide" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline id="aim-line" stroke="#fff8e5" stroke-width="1.6" stroke-dasharray="5 5"/><path id="object-line" stroke="#ffd47e" stroke-width="1.8" stroke-dasharray="4 5"/></g></svg></div><div class="side-controls"><aside class="spin-panel"><strong>Spin</strong><div id="contact-ball" class="contact-ball" role="group" tabindex="0" aria-label="Cue-ball contact point. The dashed ring marks the miscue limit. Click or drag to select spin. Arrow keys adjust; Home centers."><span class="miscue-limit" aria-hidden="true"></span><span id="contact-marker"></span></div><output id="spin-value">Center hit</output><button id="center-spin">Center</button></aside><aside class="power-panel"><label for="power">Power</label><input id="power" type="range" min="0" max="100" value="85" aria-orientation="vertical"><output id="power-value" for="power">85%</output></aside><button id="shoot" class="primary" disabled>Shoot</button></div></div>
  <div class="controls"><label class="control" for="angle">Aim <input id="angle" type="range" min="-180" max="180" step="0.5" value="0"><output id="angle-value">0°</output></label><button id="reset">New Rack</button><button id="reset-shot" hidden>Reset Shot</button><label class="control" for="practice">Practice <select id="practice"><option value="rack">Full rack</option><option value="follow">Follow shot</option><option value="draw">Draw shot</option><option value="cushion">Cushion spin</option></select></label><label class="control" for="cue-style">Cue <select id="cue-style"><option value="peacock">Peacock · blue, white, ice blue</option><option value="malachite">Malachite · green and yellow</option><option value="ember">Ember · red, maple and cream</option></select></label><button id="guides" aria-pressed="true" title="Preview six seconds using the selected power and spin.">Guides</button><button id="sound" aria-pressed="true">Sound</button><button id="cut-throw" aria-pressed="true">Cut throw</button><button id="spin-throw" aria-pressed="true">Spin throw</button><div class="score"><span id="pot-count"><strong id="score">0 / 15</strong> potted ·</span> <span id="shots">0 shots</span></div></div>
