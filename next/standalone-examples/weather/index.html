<body><div id="scene" aria-label="Interactive riverfront weather"></div>
<aside class="luma-example-infobox luma-example-infobox--overlay"><div class="eyebrow">LUMA.GL + DECK.GL</div><h1>Riverfront weather</h1>
<section class="control-card"><h2>Scene</h2>
<label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
<label>Weather<select id="preset"><option value="clear">None</option><option value="rain" selected>Rain</option><option value="snow">Snow</option></select></label>
<label class="toggle">Fog<input id="fog-enabled" type="checkbox" checked /></label>
<label class="toggle">Animate<input id="playing" type="checkbox" checked /></label></section>
<section class="control-card"><h2>Atmosphere</h2>
<label>Weather intensity<input id="intensity" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
<label>Wind (m/s)<input id="wind-speed" type="range" min="0" max="20" step="0.5" value="6" /></label>
<label>Wind direction<input id="wind-direction" type="range" min="0" max="360" step="5" value="45" /></label>
<label>Fog visibility (m)<input id="visibility" type="range" min="200" max="5000" step="100" value="700" /></label>
<label>Fog variation<input id="fog-variation" type="range" min="0" max="1" step="0.05" value="1" /></label>
<label>Fog drift (m/s)<input id="fog-speed" type="range" min="0" max="12" step="0.5" value="3" /></label>
<button id="reset">Reset weather</button></section>
<div id="status" class="hint" role="status">Wind-driven precipitation and drifting fog.<br />Drag to move · Scroll to zoom<br />Shift + drag to orbit</div></aside></body></html>
