<!doctype html>
<head>
  <title>glTF Features</title>
  <script type="module">
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/core/webgpu';
    import {webgl2Adapter} from '@luma.gl/core/webgl';
    import AnimationLoopTemplate from './app.ts';
    const backend = new URLSearchParams(location.search).get('backend');
    const adapters = backend === 'webgl' ? [webgl2Adapter] : backend === 'webgpu' ? [webgpuAdapter] : [webgpuAdapter, webgl2Adapter];
    const feature = new URLSearchParams(location.search).get('feature') || 'billboard';
    if (feature !== 'billboard' && feature !== 'lightmap' && feature !== 'area-lights') throw new Error(`Unknown glTF feature: ${feature}`);
    document.getElementById('info').innerHTML = AnimationLoopTemplate.getInfo(feature);
    class ConfiguredFeature extends AnimationLoopTemplate {
      constructor(animationProps) { super(animationProps, feature); }
    }
    const animationLoop = makeAnimationLoop(ConfiguredFeature, {adapters});
    animationLoop.start();
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
    body {
      background: black;
      margin: 0;
    }

    canvas {
      height: 100% !important;
      width: 100% !important;
      transition: opacity 1s ease-in-out;
    }

    #model-options {
      position: absolute;
      left: 10px;
      top: 10px;
      padding: 4px;
      background-color: gray;
      user-select: none;
    }

    #model-options label {
      color: white;
    }
    #error {
      position: absolute;
      left: 10px;
      top: 120px;
      color: red;
    }
  </style>
</head>
<body><div id="info" style="position:absolute;top:0;left:0;max-width:360px;background:rgba(8,15,27,.94);color:#e2e8f0;border:1px solid #334155;border-radius:12px;margin:12px;padding:12px;font:14px/1.5 sans-serif"></div></body>
