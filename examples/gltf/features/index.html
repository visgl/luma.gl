<!doctype html>
<head>
  <script type="module">
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/core/webgpu';
    import {webgl2Adapter} from '@luma.gl/core/webgl';
    import AnimationLoopTemplate from './app.ts';
    document.getElementById('info').innerHTML = AnimationLoopTemplate.info;
    const adapters = new URLSearchParams(location.search).get('backend') === 'webgl' ? [webgl2Adapter] : [webgpuAdapter, webgl2Adapter];
    const feature = new URLSearchParams(location.search).get('feature') || 'billboard';
    if (feature !== 'billboard') throw new Error(`Unknown glTF feature: ${feature}`);
    class ConfiguredFeature extends AnimationLoopTemplate {
      constructor(animationProps) { super(animationProps, feature); }
    }
    const animationLoop = makeAnimationLoop(ConfiguredFeature, {adapters});
    animationLoop.start();
  </script>
  <style>
    body {
      background: black;
      margin: 0;
    }

    canvas {
      height: 100% !important;
      width: 100% !important;
      transition: opacity 1s ease-in-out;
    }

    #model-options {
      position: absolute;
      left: 10px;
      top: 10px;
      padding: 4px;
      background-color: gray;
      user-select: none;
    }

    #model-options label {
      color: white;
    }
    #error {
      position: absolute;
      left: 10px;
      top: 120px;
      color: red;
    }
  </style>
</head>
<body><div id="info" style="position:absolute;top:0;left:0;max-width:360px;background:#fffd;padding:12px;font:14px sans-serif"></div></body>
