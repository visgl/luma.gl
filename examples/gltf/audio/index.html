<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glTF Spatial Audio</title>
    <style>
      html, body {width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: sans-serif;}
      canvas {width: 100% !important; height: 100% !important;}
      #credits {position: absolute; bottom: 0; background: #18202c; color: #edf2fa; z-index: 2; padding: 8px; max-width: 600px; font-size: 12px;}
    </style>
  </head>
  <body>
    <aside id="credits"></aside>
    <script type="module">
      import {luma} from '@luma.gl/core';
      import {makeAnimationLoop} from '@luma.gl/engine';
      import {webgpuAdapter} from '@luma.gl/core/webgpu';
      import {webgl2Adapter} from '@luma.gl/core/webgl';
      import AnimationLoopTemplate from './app.ts';
      import {INFO_HTML} from './app-ui.ts';
      document.getElementById('credits').innerHTML = INFO_HTML;
      const type = new URLSearchParams(location.search).get('backend') || 'best-available';
      const feature = new URLSearchParams(location.search).get('feature') || 'emitter';
      if (feature !== 'emitter' && feature !== 'graph') throw new Error(`Unknown glTF audio feature: ${feature}`);
      class ConfiguredAudio extends AnimationLoopTemplate {
        constructor(animationProps) { super(animationProps, feature); }
      }
      const animationLoop = makeAnimationLoop(ConfiguredAudio, {
        device: luma.createDevice({type, adapters: [webgpuAdapter, webgl2Adapter], createCanvasContext: true})
      });
      animationLoop.start();
    </script>
  </body>
</html>
