<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="gltf/marionette-theater" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document
        .querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])')
        .forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Marionette Theater</title>
  <style>
    html, body {height:100%;margin:0;background:#1a1416;color:#f7e3c4}
    body {position:relative}
    canvas {width:100% !important;height:100% !important;display:block;touch-action:none}
    #startup-error {position:absolute;top:16px;left:16px;font:14px system-ui}
  </style>
</head>
<body>
  <div id="startup-error" role="alert"></div>
  <script type="module" src="./ragdolls.ts"></script>
</body>
</html>
