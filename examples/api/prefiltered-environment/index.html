<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prefiltered environment · luma.gl</title>
    <link rel="icon" href="data:," />
    <style>
      body {margin: 24px; background: #101418; color: #e5e7eb; font: 16px system-ui;}
      canvas {width: min(100%, 1000px); aspect-ratio: 5 / 3;}
    </style>
  </head>
  <body>
    <h1>Prefiltered environment</h1>
    <p>Roughness increases left to right. Metalness increases bottom to top.</p>
    <canvas id="environment" width="1000" height="600"></canvas>
    <script type="module">
      import {luma} from '@luma.gl/core';
      import {makeAnimationLoop} from '@luma.gl/engine';
      import {webgpuAdapter} from '@luma.gl/core/webgpu';
      import {webgl2Adapter} from '@luma.gl/core/webgl';
      import AnimationLoopTemplate from './app.ts';

      const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {
        device: luma.createDevice({
          type: new URLSearchParams(location.search).get('backend') || 'best-available',
          adapters: [webgpuAdapter, webgl2Adapter],
          createCanvasContext: {canvas: 'environment'}
        })
      });
      animationLoop.start();
    </script>
  </body>
</html>
