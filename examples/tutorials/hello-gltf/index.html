<!doctype html>
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="tutorials/hello-gltf" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document
        .querySelectorAll('[data-luma-example-deferred]')
        .forEach(script => script.remove());
    } else {
      document.querySelectorAll('[data-luma-example-deferred]').forEach(script => {
        const activeScript = script.cloneNode(true);
        activeScript.type = 'module';
        activeScript.removeAttribute('data-luma-example-deferred');
        script.replaceWith(activeScript);
      });
    }
  </script>
  <!-- /luma-example-support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="luma-example-module" data-luma-example-deferred>
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/webgpu';
    import {webgl2Adapter} from '@luma.gl/webgl';
    import AnimationLoopTemplate from './app.ts';
    const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {adapters: [webgpuAdapter, webgl2Adapter]});
    animationLoop.start();
  </script>
  <style>
    body {
      background: black;
      margin: 0;
    }

    canvas {
      height: 100% !important;
      width: 100% !important;
      transition: opacity 1s ease-in-out;
    }

    #model-options {
      position: absolute;
      left: 10px;
      top: 10px;
      padding: 4px;
      background-color: gray;
      user-select: none;
    }

    #model-options label {
      color: white;
    }
    #error {
      position: absolute;
      left: 10px;
      top: 120px;
      color: red;
    }
  </style>
</head>
<body>
  <div id="model-options">
    <!-- Loaded dynamically from model index -->
    <select id="model-select"></select>
    <div><label><input type="checkbox" id="cameraAnimation" />Camera Animation</label></div>
    <div><label><input type="checkbox" id="gltfAnimation" />glTF Animation</label></div>
    <div><label><input type="checkbox" id="pbr" />PBR</label></div>
  </div>
  <div id="error"></div>
</body>
