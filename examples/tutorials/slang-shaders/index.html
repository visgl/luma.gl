<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slang Shaders</title>
  <link rel="icon" href="data:," />
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="tutorials/slang-shaders" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])')
        .forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <style>body { margin: 0; background: #0a0f1f; } canvas { width: 100vw; height: 100vh; }</style>
</head>
<body>
  <script type="module">
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgl2Adapter} from '@luma.gl/webgl';
    import {webgpuAdapter} from '@luma.gl/webgpu';
    import SlangShadersExample from './app.ts';

    const backend = new URLSearchParams(location.search).get('backend');
    const adapters = backend === 'webgl2' ? [webgl2Adapter] : [webgpuAdapter, webgl2Adapter];
    makeAnimationLoop(SlangShadersExample, {adapters}).start();
  </script>
</body>
</html>
