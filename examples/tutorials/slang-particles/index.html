<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slang Particles</title>
  <link rel="icon" href="data:," />
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="tutorials/slang-particles" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="reduced" />
  <meta name="luma-example-mobile-profile" content="simulation" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])')
        .forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <style>body { margin: 0; overflow: hidden; background: #0a0f1f; } canvas { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
  <canvas id="slang-particles-canvas"></canvas>
  <script type="module">
    import {luma} from '@luma.gl/core';
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/webgpu';
    import SlangShadersExample from './app.ts';

    const adapters = [webgpuAdapter];
    const device = await luma.createDevice({adapters, createCanvasContext: {canvas: 'slang-particles-canvas'}});
    makeAnimationLoop(SlangShadersExample, {device}).start();
  </script>
</body>
</html>
