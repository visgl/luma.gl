<!doctype html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volumetric Fire Forge</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050201; }
    canvas { display: block; width: 100vw !important; height: 100vh !important; }
    #webgpu-message {
      box-sizing: border-box;
      display: grid;
      place-content: center;
      width: min(34rem, calc(100% - 3rem));
      min-height: 100%;
      margin: auto;
      color: #ffe0b2;
      font: 500 1rem/1.6 system-ui, sans-serif;
      text-align: center;
    }
    #webgpu-message[hidden] { display: none; }
    #webgpu-message strong { color: #fff4e5; font-size: 1.2rem; }
  </style>
</head>
<script type="module">
  import {luma} from '@luma.gl/core';
  import {makeAnimationLoop} from '@luma.gl/engine';
  import {webgpuAdapter} from '@luma.gl/webgpu';
  import AnimationLoopTemplate from './app.ts';

  const supportsHighDynamicRange =
    typeof window.matchMedia === 'function' &&
    window.matchMedia('(dynamic-range: high)').matches;

  async function start() {
    const message = document.getElementById('webgpu-message');
    if (!navigator.gpu) {
      message.hidden = false;
      return;
    }

    try {
      let device;
      try {
        device = await luma.createDevice({
          id: 'volumetric-fire-forge',
          adapters: [webgpuAdapter],
          createCanvasContext: supportsHighDynamicRange
            ? {colorFormat: 'rgba16float', colorSpace: 'display-p3', toneMapping: 'extended'}
            : true
        });
      } catch (error) {
        if (!supportsHighDynamicRange) {
          throw error;
        }
        device = await luma.createDevice({
          id: 'volumetric-fire-forge-sdr-fallback',
          adapters: [webgpuAdapter],
          createCanvasContext: true
        });
      }

      const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {device});
      animationLoop.start();
    } catch (error) {
      console.error(error);
      message.hidden = false;
    }
  }

  start();
</script>
<body>
  <main id="webgpu-message" hidden>
    <p>
      <strong>Volumetric Fire Forge requires WebGPU.</strong><br />
      Open this example in a current WebGPU-capable browser.
    </p>
  </main>
</body>
