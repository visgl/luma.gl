<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="experimental/gpu-pointcloud" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPU Point Cloud · Cleanup Lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050a14; color: #d8e6f5; font: 14px system-ui; }
    main { position: relative; height: 100%; }
    main > section { position: relative; height: 100%; min-width: 0; min-height: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    header { position: absolute; top: 20px; left: 24px; pointer-events: none; }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
    aside { position: absolute; top: 12px; left: 12px; width: 340px; max-width: calc(100% - 24px); max-height: calc(100% - 24px); overflow: auto; }
    @media (max-width: 700px) { aside { width: 300px; } }
  </style>
</head>
<body>
  <main>
    <section><canvas id="spatial-canvas" width="1000" height="800"></canvas></section>
    <aside><details class="luma-example-infobox spatial-infobox" data-info-box-appearance="cinematic" open><summary><span class="eyebrow">luma.gl · WebGPU</span><h1>GPU Point Cloud · Cleanup Lab</h1></summary><div id="example-panel-host" data-example-panel-host=""></div></details></aside>
  </main>
  <script type="module">
    import {luma} from '@luma.gl/core';
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/core/webgpu';
    import AnimationLoopTemplate from './app.ts';
    const device = await luma.createDevice({adapters: [webgpuAdapter], createCanvasContext: {canvas: 'spatial-canvas'}});
    const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {device});
    await animationLoop.start();
  </script>
</body>
</html>
