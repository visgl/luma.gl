<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Off-road buggy · luma.gl</title>
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <canvas id="view" aria-label="Off-road buggy driving across uneven terrain"></canvas>
  <div id="info"></div>
  <section id="dashboard" hidden>
    <div class="speed"><strong id="speed">—</strong> km/h <output id="status">Starting WebGPU…</output></div>
    <div class="instruments">
      <section><h2>Chassis attitude</h2>
        <div class="attitude" aria-hidden="true"><div id="horizon"></div><i></i></div>
        <div id="angles">Pitch — · Roll —</div>
      </section>
      <section><h2>Spring travel</h2><div id="suspension"></div></section>
    </div>
    <h2>Body motion <small>last 6 s</small></h2>
    <canvas id="motion" width="620" height="80" aria-label="Recent pitch and roll around level, with a range of plus or minus 30 degrees"></canvas>
    <div class="legend"><span>Pitch</span><span>Roll</span></div>
    <h2>Axle load</h2>
    <div class="axle-track" aria-hidden="true"><i id="front-load"></i></div>
    <div id="load">Awaiting wheel contact</div>
    <div class="actions"><button id="reset">Reset</button><button id="camera">Chase camera</button><button id="demo">Drive manually</button></div>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
