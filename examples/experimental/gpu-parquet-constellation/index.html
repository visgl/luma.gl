<!doctype html>
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="experimental/gpu-parquet-constellation" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="reduced" />
  <meta name="luma-example-mobile-profile" content="large-data" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document
        .querySelectorAll('[data-luma-example-deferred]')
        .forEach(script => script.remove());
    } else {
      document.querySelectorAll('[data-luma-example-deferred]').forEach(script => {
        const activeScript = script.cloneNode(true);
        activeScript.type = 'module';
        activeScript.removeAttribute('data-luma-example-deferred');
        script.replaceWith(activeScript);
      });
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPU Parquet Constellation</title>
  <style>
    body { margin: 0; background: #01030d; color: #e2e8f0; font: 14px/1.4 system-ui, sans-serif; }
    #controls { position: fixed; z-index: 1; top: 16px; left: 16px; width: min(360px, calc(100vw - 66px)); max-height: calc(100vh - 66px); overflow: auto; padding: 16px; border: 1px solid #334155; border-radius: 10px; background: rgb(2 6 23 / 88%); backdrop-filter: blur(8px); }
    button, select { margin-left: 6px; }
  </style>
</head>
<body>
  <aside id="controls"></aside>
</body>
<script type="luma-example-module" data-luma-example-deferred>
  import {makeAnimationLoop} from '@luma.gl/engine';
  import {webgpuAdapter} from '@luma.gl/webgpu';
  import AnimationLoopTemplate from './app.ts';

  document.querySelector('#controls').innerHTML = AnimationLoopTemplate.info;
  const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {adapters: [webgpuAdapter]});
  animationLoop.start();
</script>
