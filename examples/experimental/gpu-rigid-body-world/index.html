<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Rigid Bodies</title>
<style>html,body{margin:0;height:100%;background:#e6e9e4;color:#213c35;font:14px system-ui}canvas{width:100%;height:100%;display:block}aside{position:absolute;top:20px;left:20px;width:270px;background:#fffffff0;border:1px solid #b8c6bc;border-radius:14px;padding:20px;box-shadow:0 8px 32px #203c3515}h1{font:500 27px Georgia;margin:0 0 10px}p{line-height:1.5}button,select{font:inherit;padding:9px;border:1px solid #b8c6bc;border-radius:6px;background:#f7f8f4;color:inherit;margin:3px 0}output{display:block;margin-top:12px;font-size:12px;line-height:1.6}a{color:#286954}@media(max-width:600px){aside{top:10px;left:10px;width:220px;padding:12px}}</style></head>
<body><canvas id="world"></canvas><aside><h1>Rigid bodies on GPU</h1><p>Oriented boxes, spheres and persistent contact manifolds. Drag to orbit; scroll to zoom.</p><label>Scene <select id="scene"><option value="stack">Box stacks</option><option value="mixed">Mixed shapes</option><option value="impact">Off-center impact</option></select></label><br><button id="reset">Reset</button> <button id="push">Push a box</button> <button id="pause">Pause</button><output id="status">Compiling GPU physics…</output><p>Bounded reference solver: up to 128 bodies. Rendering reads GPU transforms directly.</p></aside><script type="module" src="./main.ts"></script></body></html>
