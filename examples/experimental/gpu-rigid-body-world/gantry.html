<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two-arm gantry</title>
<style>
html,body,#info,#lab-canvas,canvas{margin:0;width:100%;height:100%;min-width:0;min-height:0}canvas{display:block;touch-action:none}body{font:13px system-ui;background:#202930}#lab-actions:not([hidden]){display:flex;align-items:center;gap:8px;flex-wrap:wrap}#lab-controls label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}#lab-actions output,#reading{font-variant-numeric:tabular-nums}button{border:1px solid #607180;border-radius:5px;background:#26333d;color:#fff;padding:5px 9px}button:disabled{opacity:.5}#error:empty{display:none}#error{position:absolute;bottom:8px;background:#fff;color:#842718}#reading{display:block;margin-block:8px}
</style>
</head><body>
<div id="info"><div id="lab-canvas"><canvas id="world"></canvas></div></div>
<div id="lab-actions" role="toolbar" aria-label="Gantry controls" hidden><button id="cycle" disabled>Lift beam</button><button id="release" disabled>Release left</button><output id="loads" aria-label="Left and right support force"></output></div>
<section id="lab-controls" hidden><label>Ballast position <input id="ballast" type="range" min="-0.7" max="0.7" step="0.05" value="0.35"><output id="offset">+0.35 m</output></label>
<label>Parts <select id="parts"><option>64</option><option>256</option></select></label><output id="reading"></output></section>
<section id="lab-details" hidden>Two powered forks lift one free beam. Move the ballast toward one end and compare the support forces while the beam is held. Transfer the beam to the receiving stands or release the left fork. Drag to orbit.</section>
<output id="error" role="alert"></output><script type="module" src="./gantry-lab.ts"></script>
</body></html>
