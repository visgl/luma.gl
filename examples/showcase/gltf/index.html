<!doctype html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>glTF Animation Studio</title>
  <script type="module">
    import {luma} from '@luma.gl/core';
    import {makeAnimationLoop} from '@luma.gl/engine';
    import {webgpuAdapter} from '@luma.gl/webgpu';
    import {webgl2Adapter} from '@luma.gl/webgl';
    import AnimationLoopTemplate from './app.ts';

    const requestedDevice = new URLSearchParams(window.location.search).get('device');
    const adapters =
      requestedDevice === 'webgl'
        ? [webgl2Adapter]
        : requestedDevice === 'webgpu'
          ? [webgpuAdapter]
          : [webgpuAdapter, webgl2Adapter];
    const supportsHighDynamicRange =
      requestedDevice !== 'webgl' &&
      typeof window.matchMedia === 'function' &&
      window.matchMedia('(dynamic-range: high)').matches;
    const device = luma.createDevice({
      id: 'gltf',
      adapters,
      createCanvasContext: supportsHighDynamicRange
        ? {colorFormat: 'rgba16float', colorSpace: 'display-p3', toneMapping: 'extended'}
        : true
    });
    const animationLoop = makeAnimationLoop(AnimationLoopTemplate, {device});
    animationLoop.start();
  </script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      background: black;
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      height: 100% !important;
      width: 100% !important;
      transition: opacity 1s ease-in-out;
    }

    #example-panel-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      box-sizing: border-box;
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 14px 16px 16px;
      border: 1px solid rgb(148 163 184 / 24%);
      border-radius: 14px;
      background:
        radial-gradient(ellipse at 12% 0%, rgb(56 189 248 / 8%), transparent 42%),
        linear-gradient(145deg, rgb(15 23 42 / 95%), rgb(5 12 24 / 91%));
      box-shadow:
        0 22px 58px rgb(0 0 0 / 40%),
        inset 0 1px 0 rgb(255 255 255 / 7%);
      color: rgb(226 232 240);
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      scrollbar-color: rgb(148 163 184 / 55%) transparent;
      backdrop-filter: blur(18px) saturate(135%);
    }

    #gltf-studio-header {
      padding-bottom: 13px;
      border-bottom: 1px solid rgb(148 163 184 / 16%);
    }

    #gltf-studio-header p {
      margin: 0;
      color: rgb(148 163 184);
      font-size: 12px;
      line-height: 1.5;
    }

    #gltf-studio-header h1 {
      margin: 3px 0 1px;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1.35;
    }

    #example-panel-host {
      padding-top: 9px;
      width: 100%;
    }

    #example-panel-container:has(#example-panel-host:empty) {
      display: none;
    }

    #example-panel-host select,
    #example-panel-host input,
    #example-panel-host button {
      max-width: 100%;
    }

    [id^='settings-panel-input-'][role='listbox'] {
      --button-background: rgb(15 23 42 / 92%);
      --button-icon-hover: rgb(240 249 255);
      --button-icon-idle: rgb(148 163 184);
      --button-inner-stroke: 1px solid rgb(148 163 184 / 24%);
      --button-text: rgb(226 232 240);
      --container-background: rgb(8 15 27);
      --menu-background: rgb(8 15 27);
      --menu-item-hover: rgb(125 211 252 / 12%);
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (max-width: 480px) {
      #example-panel-container {
        top: 10px;
        right: 10px;
        width: min(420px, calc(100vw - 20px));
        max-height: calc(100vh - 20px);
      }
    }
  </style>
</head>
<body>
  <aside
    id="example-panel-container"
    aria-label="glTF Animation Studio controls"
    data-info-box-appearance="cinematic"
  >
    <header id="gltf-studio-header">
      <p>luma.gl · glTF</p>
      <h1>Animation Studio</h1>
      <p>Models, lighting, and GPU animation</p>
    </header>
    <div id="example-panel-host" data-example-panel-host></div>
  </aside>
</body>
