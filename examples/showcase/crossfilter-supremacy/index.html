<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050812" />
    <title>Crossfilter Supremacy · GPU-Resident Linked Views</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 72% 18%, rgb(39 113 189 / 13%), transparent 42%),
          radial-gradient(ellipse at 15% 90%, rgb(112 68 214 / 11%), transparent 42%),
          #050812;
        color: #edf4ff;
      }

      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
      }

      #crossfilter-startup {
        position: fixed;
        z-index: 20;
        display: grid;
        place-content: center;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .startup-card {
        width: min(420px, calc(100vw - 72px));
        padding: 28px 32px;
        border: 1px solid rgb(120 168 255 / 18%);
        border-radius: 18px;
        background: rgb(12 19 34 / 78%);
        box-shadow: 0 32px 96px rgb(0 0 0 / 38%);
        backdrop-filter: blur(18px);
      }

      .startup-eyebrow {
        margin: 0 0 10px;
        color: #75d9e8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .startup-title {
        margin: 0 0 9px;
        font-size: 27px;
        font-weight: 680;
        letter-spacing: -0.045em;
      }

      .startup-status {
        margin: 0;
        color: #9bacc5;
        font-size: 13px;
        line-height: 1.6;
      }

      .startup-status[data-state='error'] {
        color: #ffa6a6;
        white-space: pre-wrap;
      }

    </style>
  </head>
  <body>
    <noscript>This interactive WebGPU demonstration requires JavaScript.</noscript>
    <main id="crossfilter-startup" aria-live="polite">
      <section class="startup-card">
        <p class="startup-eyebrow">luma.gl · WebGPU</p>
        <h1 class="startup-title">Crossfilter Supremacy</h1>
        <p class="startup-status" data-startup-status>Preparing one million GPU-resident rows…</p>
      </section>
    </main>
    <script type="module">
      const startup = document.querySelector('#crossfilter-startup');
      const status = document.querySelector('[data-startup-status]');

      try {
        if (!navigator.gpu) {
          throw new Error('This browser does not expose WebGPU. Try a recent Chromium browser.');
        }

        const [{luma}, {makeAnimationLoop}, {webgpuAdapter}, {default: AnimationLoopTemplate}] =
          await Promise.all([
            import('@luma.gl/core'),
            import('@luma.gl/engine'),
            import('@luma.gl/webgpu'),
            import('./app.ts')
          ]);

        status.textContent = 'Acquiring a high-performance WebGPU device…';
        const device = await luma.createDevice({
          id: 'crossfilter-supremacy',
          adapters: [webgpuAdapter],
          featureLevel: 'best-available',
          powerPreference: 'high-performance',
          waitForPageLoad: false,
          createCanvasContext: true
        });

        status.textContent = 'Compiling the linked-view command graph…';
        await makeAnimationLoop(AnimationLoopTemplate, {device}).start();
        startup.remove();
      } catch (error) {
        console.error('Crossfilter Supremacy failed to start.', error);
        status.dataset.state = 'error';
        status.textContent = error instanceof Error ? error.message : String(error);
      }
    </script>
  </body>
</html>
