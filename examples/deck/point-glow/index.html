<!doctype html>
<html lang="en">
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/point-glow" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="full" />
  <meta name="luma-example-mobile-profile" content="standard" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document.querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])').forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css" />
  <title>Riverfront lights · luma.gl</title>
</head>
<body>
  <div id="scene" aria-label="Interactive illuminated riverfront"></div>
  <aside class="luma-example-infobox luma-example-infobox--overlay">
    <p class="eyebrow">luma.gl + deck.gl</p><h1>Riverfront lights</h1>
    <section class="control-card"><h2>Scene</h2>
      <label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label>
      <label class="toggle"><input id="enabled" type="checkbox" checked /> Glow points</label>
    </section>
    <section class="control-card"><h2>Light</h2>
      <label>Radius (px)<input id="radius" type="range" min="0" max="40" step="1" value="18" /></label>
      <label>Core size<input id="coreRadius" type="range" min="0" max="0.5" step="0.01" value="0.12" /></label>
      <label>Core intensity<input id="coreIntensity" type="range" min="0" max="2" step="0.05" value="0.7" /></label>
      <label>Halo intensity<input id="haloIntensity" type="range" min="0" max="2" step="0.05" value="0.5" /></label>
      <label>Falloff<input id="falloff" type="range" min="1" max="12" step="0.5" value="5" /></label>
    </section>
    <output id="selection" class="selection" aria-live="polite">Click a light to inspect</output>
    <p class="hint" id="status">Soft additive halos with depth occlusion.<br />Drag to move · Scroll to zoom<br />Shift + drag to orbit</p>
  </aside>
  <script type="module" src="./main.ts"></script>
</body>
</html>
