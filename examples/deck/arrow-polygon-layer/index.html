<!doctype html>
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/arrow-polygon-layer" />
  <meta name="luma-example-backends" content="webgpu,webgl2" />
  <meta name="luma-example-mobile" content="reduced" />
  <meta name="luma-example-mobile-profile" content="dense" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document
        .querySelectorAll('script[type="module"]:not([data-luma-example-support-bootstrap])')
        .forEach(script => script.remove());
    }
  </script>
  <!-- /luma-example-support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<script type="module">
  import {createArrowPolygonLayerDeck} from './app.ts';
  const deviceSelect = document.querySelector('#deck-device');
  let example = createArrowPolygonLayerDeck(undefined, {deviceType: deviceSelect.value});
  deviceSelect.addEventListener('change', () => {
    example.finalize();
    example = createArrowPolygonLayerDeck(undefined, {deviceType: deviceSelect.value});
  });
</script>
<body>
  <label style="position: fixed; top: 12px; left: 12px; z-index: 10; padding: 8px 10px; background: white; font: 14px sans-serif;">
    Device
    <select id="deck-device">
      <option value="webgpu">WebGPU</option>
      <option value="webgl">WebGL2</option>
    </select>
  </label>
  <div id="arrow-example-panel-host" data-example-panel-host="" style="position: fixed; top: 12px; right: 12px; z-index: 10; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: white;"></div>
</body>
