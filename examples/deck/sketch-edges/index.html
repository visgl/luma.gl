<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="icon" href="data:," /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sketch buildings · luma.gl</title>
<style>
html,body,#scene {margin:0;width:100%;height:100%;overflow:hidden;background:#e6e2d9;font:13px system-ui;color:#292b2e}
aside {position:absolute;z-index:1;top:12px;left:12px;width:218px;padding:14px;background:#faf9f4ed;border:1px solid #bcb8ae;border-radius:8px;box-shadow:0 5px 20px #0002}
h1{font-size:20px;margin:0 0 12px}p{font-size:11px;color:#656660;line-height:1.5;margin:12px 0 0}fieldset{border:1px solid #d9d6ce;border-radius:6px;margin:8px 0;padding:8px}legend{font-size:10px;letter-spacing:.08em;text-transform:uppercase}label{display:flex;align-items:center;justify-content:space-between;margin:7px 0;gap:12px}select{max-width:120px;padding:3px}input[type=range]{width:110px}input[type=checkbox]{accent-color:#68635b}
</style></head>
<body><div id="scene" aria-label="Interactive architectural sketch"></div><aside><h1>Sketch buildings</h1>
<fieldset><legend>Scene</legend><label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL2</option></select></label><label>Building faces<input id="fills" type="checkbox" checked /></label><label>Edges<input id="edges" type="checkbox" checked /></label></fieldset>
<fieldset><legend>Stroke</legend><label>Style<select id="style"><option value="sketch">Pencil</option><option value="solid">Solid</option></select></label><label>Width<input id="width" type="range" min="1" max="6" step="0.1" value="2.2" /></label><label>Irregularity<input id="jitter" type="range" min="0" max="3" step="0.05" value="0.85" /></label><label>Grain<input id="grain" type="range" min="0" max="0.9" step="0.05" value="0.6" /></label><label>Extension<input id="extension" type="range" min="0" max="15" step="1" value="4" /></label></fieldset>
<p id="status">Drag to move · Scroll to zoom<br />Shift + drag to orbit · Click to inspect</p></aside><script type="module" src="./main.ts"></script></body></html>
