<!doctype html>
<head>
  <!-- luma-example-support -->
  <meta name="luma-example-id" content="deck/gpu-culled-trace" />
  <meta name="luma-example-backends" content="webgpu" />
  <meta name="luma-example-mobile" content="reduced" />
  <meta name="luma-example-mobile-profile" content="large-data" />
  <script type="module" data-luma-example-support-bootstrap>
    import {installStandaloneExampleSupport} from '../../example-support.ts';
    const exampleSupport = await installStandaloneExampleSupport();
    if (!exampleSupport.supported) {
      document
        .querySelectorAll('[data-luma-example-deferred]')
        .forEach(script => script.remove());
    } else {
      document.querySelectorAll('[data-luma-example-deferred]').forEach(script => {
        const activeScript = script.cloneNode(true);
        activeScript.type = 'module';
        activeScript.removeAttribute('data-luma-example-deferred');
        script.replaceWith(activeScript);
      });
    }
  </script>
  <!-- /luma-example-support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<script type="luma-example-module" data-luma-example-deferred>
  import {createGPUCulledTraceDeck} from './app.ts';
  createGPUCulledTraceDeck(undefined, {deviceType: 'webgpu'});
</script>
<body style="margin:0;background:#030712">
  <div style="position:fixed;top:12px;left:12px;z-index:10;padding:8px 10px;border-radius:6px;background:#fffffff0;font:13px sans-serif">
    WebGPU · 25K spans · drag/scroll to inspect
  </div>
  <div style="position:fixed;right:12px;top:12px;z-index:10;width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto">
    <div id="arrow-example-panel-host" data-example-panel-host=""></div>
  </div>
</body>
